<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ข้าคือนนทก — ฉบับภาพยนตร์ (เดโม)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600;800&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#d9b46a;--gold2:#f3dcaa;--ink:#efe6d6;--muted:#a99f8e;--red:#e0624f;--green:#7fd39b;--glass:rgba(14,10,20,.86)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#000}
body{font-family:"Sarabun",system-ui,sans-serif;color:var(--ink);font-size:17px;line-height:1.55}
#app{max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#000}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.serif{font-family:"Noto Serif Thai",serif}
/* HUD */
.hud{position:absolute;top:0;left:0;right:0;z-index:22;display:flex;align-items:center;gap:8px;padding:10px 12px;font-family:"Noto Serif Thai";font-size:13px;color:var(--gold2);letter-spacing:.5px;pointer-events:none}
.hud .ch{flex:1;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud button{pointer-events:auto;background:rgba(0,0,0,.35);border:1px solid rgba(217,180,106,.45);color:var(--gold2);border-radius:999px;padding:4px 10px;font-size:13px;backdrop-filter:blur(4px)}
/* scene */
.scene{flex:1;position:relative;overflow:hidden;min-height:300px;background:#000}
.cam{position:absolute;inset:0;transition:transform 1.2s cubic-bezier(.2,.7,.2,1);transform-origin:40% 62%}
.scene.talk .cam{transform:scale(1.18)}
.scene.talk .lay-far,.scene.talk .lay-mid{filter:blur(2.5px)}
.lay{position:absolute;left:0;bottom:0;will-change:transform;transition:filter 1.2s}
.sky{position:absolute;inset:0}
.glow{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen}
.rays{position:absolute;inset:-30%;pointer-events:none;mix-blend-mode:screen;opacity:.5;animation:rays 9s ease-in-out infinite alternate}
@keyframes rays{to{opacity:.25;transform:rotate(2deg)}}
.fog{position:absolute;left:-50%;width:200%;height:140px;pointer-events:none;filter:blur(18px);animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(25%)}}
.world{position:absolute;left:0;top:0;bottom:0;will-change:transform}
.npc{position:absolute;bottom:calc(30% - 4px);transform:translateX(-50%);text-align:center}
.npc .mark{position:absolute;left:50%;top:-22px;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:var(--gold2);box-shadow:0 0 12px 4px var(--gold);animation:pulse 1.6s ease-in-out infinite}
.npc .mark.done{background:transparent;box-shadow:none;animation:none}
@keyframes pulse{50%{transform:translate(-50%,-6px) scale(.7);opacity:.6}}
.npc .tag{display:block;font-family:"Noto Serif Thai";font-size:11px;color:var(--gold2);opacity:.8;margin-top:4px;letter-spacing:1px;white-space:nowrap;text-shadow:0 1px 4px #000}
.sil{filter:drop-shadow(-1.5px 0 0 var(--rim)) drop-shadow(1px -1px 0 var(--rim2)) drop-shadow(0 0 10px var(--rimglow))}
.player{position:absolute;bottom:calc(30% - 8px);transform:translateX(-50%);z-index:5}
.player svg{display:block}
.player.left svg{transform:scaleX(-1)}
.shadowfoot{position:absolute;left:50%;bottom:-6px;width:60px;height:10px;transform:translateX(-50%);background:radial-gradient(ellipse,#000c,transparent 70%)}
.leg{transform-box:fill-box;transform-origin:top center}
.walking .legL{animation:legA .36s infinite alternate ease-in-out}
.walking .legR{animation:legB .36s infinite alternate ease-in-out}
.walking .bodyg{animation:bob2 .36s infinite alternate ease-in-out}
@keyframes legA{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
@keyframes legB{from{transform:rotate(20deg)}to{transform:rotate(-20deg)}}
@keyframes bob2{to{transform:translateY(-1.5px)}}
.eye{animation:eyeglow 2.4s ease-in-out infinite}
@keyframes eyeglow{50%{opacity:.55}}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.grain{position:absolute;inset:-10%;pointer-events:none;opacity:.09;mix-blend-mode:overlay;z-index:12;background-size:180px 180px}
.vig{position:absolute;inset:0;pointer-events:none;z-index:11;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(0,0,0,.55) 80%,rgba(0,0,0,.85) 100%)}
.grade{position:absolute;inset:0;pointer-events:none;z-index:10;mix-blend-mode:soft-light}
.bar{position:absolute;left:0;right:0;height:9%;background:#000;z-index:13;transition:height 1.2s cubic-bezier(.2,.7,.2,1)}
.bar.t{top:0}.bar.b{bottom:0}
.scene.talk .bar.t{height:12%}.scene.talk .bar.b{height:26%}
.hint{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);color:var(--gold2);font-family:"Noto Serif Thai";font-size:13px;letter-spacing:1px;white-space:nowrap;pointer-events:none;transition:opacity .8s;z-index:14;opacity:.8;text-shadow:0 1px 6px #000}
.chtitle{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:30;animation:chfade 3.6s forwards;pointer-events:none}
.chtitle small{color:var(--gold);font-family:"Noto Serif Thai";font-size:15px;letter-spacing:2px;animation:rise 3.6s}
.chtitle b{font-family:"Noto Serif Thai";font-weight:800;font-size:34px;color:var(--gold2);margin-top:8px;letter-spacing:2px;animation:rise 3.6s;text-shadow:0 0 30px rgba(217,180,106,.35)}
.chtitle i{display:block;width:60px;height:1px;background:var(--gold);margin:14px auto 0;opacity:.6}
@keyframes chfade{0%,62%{opacity:1}100%{opacity:0}}
@keyframes rise{0%{opacity:0;transform:translateY(8px);filter:blur(4px)}25%,70%{opacity:1;transform:none;filter:none}}
/* controls */
.ctrl{display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#000;flex:0 0 auto}
.pad{flex:1;height:58px;border-radius:14px;border:1px solid rgba(217,180,106,.5);background:linear-gradient(#171019,#0b080d);color:var(--gold2);font-size:22px}
.pad.on{background:#2a1f20;border-color:var(--gold)}
.pad.mid{flex:0 0 70px;font-size:20px}
/* subtitles */
.ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 18px 4%;cursor:pointer}
.ov .sub{min-height:calc(26% - 4%);display:flex;flex-direction:column;justify-content:center}
.sub{text-align:center;max-width:460px;animation:subin .5s}
.sub .who{font-family:"Noto Serif Thai";font-size:13px;letter-spacing:1px;color:var(--gold);margin-bottom:4px;text-transform:uppercase}
.sub .tx{font-family:"Noto Serif Thai";font-size:18px;line-height:1.7;color:#fff;text-shadow:0 2px 6px #000,0 0 18px #000}
.sub .tx b{color:var(--gold2)}
.sub .tap{font-size:11px;color:var(--muted);letter-spacing:2px;margin-top:6px;animation:blink 1.4s infinite}
.sub.narr .tx{font-style:italic;color:#e9dcc2}
@keyframes subin{from{opacity:0;filter:blur(4px)}}
@keyframes blink{50%{opacity:.25}}
/* puzzle (dark glass) */
.pz{position:absolute;inset:0;z-index:25;background:rgba(0,0,0,.55);padding:12px;overflow-y:auto;display:flex;flex-direction:column;backdrop-filter:blur(3px);animation:subin .45s}
.card{background:var(--glass);border:1px solid rgba(217,180,106,.55);border-radius:14px;padding:16px;margin:auto 0;box-shadow:0 20px 60px #000,inset 0 1px 0 rgba(255,255,255,.06)}
.pzhead{font-family:"Noto Serif Thai";color:var(--gold);font-size:12px;letter-spacing:1px;margin-bottom:4px}
.q{font-family:"Noto Serif Thai";font-size:17px;margin:2px 0 12px;color:#fff}
.verse{border-left:2px solid var(--gold);padding:6px 12px;margin-bottom:12px;font-family:"Noto Serif Thai";font-size:16px;color:var(--gold2);background:linear-gradient(90deg,rgba(217,180,106,.08),transparent)}
.verse.two{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:11px 12px;margin-bottom:8px;font-size:15px;color:var(--ink)}
.opt:active{background:rgba(217,180,106,.12)}
.opt.ok{border-color:var(--green);background:rgba(127,211,155,.12);color:#d9ffe5}
.opt.no{border-color:var(--red);background:rgba(224,98,79,.12)}
.opt.pick{border-color:var(--gold);background:rgba(217,180,106,.14)}
.sent{font-size:16px;line-height:2.4}
.blank{display:inline-block;min-width:78px;border-bottom:1px solid var(--gold);text-align:center;padding:0 6px;margin:0 2px;font-family:"Noto Serif Thai";color:var(--gold2);line-height:1.6}
.blank.sel{background:rgba(217,180,106,.18)}
.blank.ok{color:var(--green);border-color:var(--green)}
.blank.no{color:var(--red);border-color:var(--red)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.tile{background:rgba(217,180,106,.08);border:1px solid rgba(217,180,106,.55);border-radius:8px;padding:8px 13px;font-family:"Noto Serif Thai";font-size:14px;color:var(--gold2)}
.tile.used{visibility:hidden}
.tile.sel{background:rgba(217,180,106,.3)}
.tile.ok{border-color:var(--green);color:var(--green);background:rgba(127,211,155,.1)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mgrid .col{display:flex;flex-direction:column;gap:8px}
.mgrid .tile{width:100%}
.slots{border:1px dashed rgba(217,180,106,.5);border-radius:10px;padding:8px;margin-bottom:10px;min-height:46px;font-family:"Noto Serif Thai";color:var(--gold2)}
.slots div{padding:2px 4px}
.fb{border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.fb.ok{background:rgba(127,211,155,.1);color:#cdf5d9;border:1px solid rgba(127,211,155,.35)}
.fb.no{background:rgba(224,98,79,.1);color:#ffc9bf;border:1px solid rgba(224,98,79,.35)}
.btn{display:block;width:100%;border:1px solid var(--gold);border-radius:10px;padding:12px;font-size:16px;margin-top:10px;background:linear-gradient(#3b2a14,#1c140a);color:var(--gold2);font-family:"Noto Serif Thai";letter-spacing:1px}
.btn:active{filter:brightness(1.3)}
.btn.gold{background:transparent}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.flash{position:absolute;inset:0;pointer-events:none;animation:fl .6s forwards;z-index:16}
@keyframes fl{from{opacity:.8}to{opacity:0}}
.get{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:17;animation:getit 2s forwards;pointer-events:none;text-align:center;font-family:"Noto Serif Thai";color:var(--gold2);letter-spacing:3px;font-size:15px;text-shadow:0 0 16px #000}
.get .gem{width:26px;height:26px;margin:0 auto 10px;transform:rotate(45deg);background:linear-gradient(135deg,#fff,#9be7ff 50%,#2a7ca8);box-shadow:0 0 30px 8px #9be7ff88}
@keyframes getit{0%{opacity:0;filter:blur(6px)}20%,75%{opacity:1;filter:none}100%{opacity:0;transform:translate(-50%,-62%)}}
.pz.stage{background:radial-gradient(ellipse at 50% 40%,#2a1530 0%,#0b0610 60%,#000 100%);backdrop-filter:none;justify-content:center}
.dstage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:10px 0}
.dspot{position:absolute;left:50%;top:-10%;width:340px;height:110%;transform:translateX(-50%);background:linear-gradient(rgba(255,225,190,.28),rgba(255,200,170,.06) 70%,transparent);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);pointer-events:none;filter:blur(6px)}
.dwrap{position:relative;filter:drop-shadow(0 0 18px rgba(255,190,150,.35));animation:sway 3.4s ease-in-out infinite}
.dwrap.d3{filter:none;animation:none}.d3c{display:block;-webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 48%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 48%,#000 55%,transparent 100%)}.dload{color:var(--muted);font-size:14px;padding:120px 0}
@keyframes sway{50%{transform:translateY(-3px)}}
.dcap{text-align:center;margin-top:4px;position:relative}
.dnum{font-family:"Noto Serif Thai";font-size:13px;color:var(--muted)}
.dname{font-family:"Noto Serif Thai";font-weight:800;font-size:30px;color:var(--gold2);text-shadow:0 0 24px rgba(217,180,106,.45);min-height:46px}
.dname.in{animation:rise2 .7s}
@keyframes rise2{from{opacity:0;transform:translateY(8px);filter:blur(3px)}}
.ddots{display:flex;gap:5px;justify-content:center;margin:8px 0 2px;flex-wrap:wrap;max-width:300px}
.ddots i{width:8px;height:8px;border-radius:50%;border:1px solid var(--gold);opacity:.6}
.ddots i.on{background:var(--gold);opacity:1}
.dbtns{width:100%;max-width:380px;padding:0 6px}
.nimg{position:relative;transform-origin:50% 100%}
.nimg img{display:block;width:100%;height:100%;transform-origin:50% 100%;-webkit-user-drag:none}
.player.left .nimg{transform:scaleX(-1)}
.walking .nimg img{animation:nwalk .36s infinite alternate ease-in-out}
@keyframes nwalk{from{transform:translateY(0) rotate(-1.6deg)}to{transform:translateY(-4px) rotate(1.6deg) scaleY(.985)}}
.neye{position:absolute;top:8.2%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle,rgba(255,120,60,.95),rgba(255,40,10,.4) 45%,transparent 70%);mix-blend-mode:screen;opacity:.35;animation:eyeglow 2.4s ease-in-out infinite;pointer-events:none}
.nfinger{display:none;position:absolute;left:90%;top:55%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle,#ffffff,#bdf2ff 30%,rgba(120,220,255,.35) 55%,transparent 72%);mix-blend-mode:screen;animation:fglow 1.6s ease-in-out infinite;pointer-events:none}
@keyframes fglow{50%{transform:scale(1.35);opacity:.75}}
.player.dk1 .neye{opacity:.8;width:20px;height:20px;margin-left:-10px}
.player.dk2 .neye{opacity:1;width:28px;height:28px;margin-left:-14px;top:7%}
.player.dk2 .nfinger{background:radial-gradient(circle,#fff,#ffd0c0 30%,rgba(255,60,40,.45) 55%,transparent 72%)}
.player.dk1 .nimg img{filter:drop-shadow(-1.5px 0 0 #ff3b2a) drop-shadow(1px -1px 0 #ff8a6a) drop-shadow(0 0 12px rgba(255,0,0,.6)) contrast(1.08)}
.player.dk2 .nimg img{filter:drop-shadow(-2px 0 0 #ff2a1a) drop-shadow(1px -1px 0 #ff8a6a) drop-shadow(0 0 20px rgba(255,0,0,.85)) contrast(1.2) brightness(.85) sepia(.25) hue-rotate(-20deg)}
.player.dk2 .nimg{transform:scale(1.12)}
.player.dk2.left .nimg{transform:scale(-1.12,1.12)}
/* torches */
.torch{position:relative;width:46px;height:176px}
.torch svg{position:absolute;left:0;bottom:0}
.flame{position:absolute;left:50%;top:-6px;width:26px;height:40px;transform:translateX(-50%);mix-blend-mode:screen}
.flame i{position:absolute;left:50%;bottom:0;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;transform-origin:50% 100%;filter:blur(1px)}
.flame i:nth-child(1){width:24px;height:36px;margin-left:-12px;background:radial-gradient(ellipse at 50% 80%,#ffb43a,#ff5a12 55%,rgba(200,30,0,0) 75%);animation:fl1 .23s infinite alternate}
.flame i:nth-child(2){width:15px;height:26px;margin-left:-7.5px;background:radial-gradient(ellipse at 50% 85%,#fff2b0,#ffc040 55%,rgba(255,120,0,0) 80%);animation:fl2 .17s infinite alternate}
.flame i:nth-child(3){width:7px;height:13px;margin-left:-3.5px;bottom:2px;background:#fffbe8;filter:blur(1.5px);animation:fl2 .13s infinite alternate}
@keyframes fl1{from{transform:scale(1,1) skewX(-3deg)}to{transform:scale(.9,1.12) skewX(4deg)}}
@keyframes fl2{from{transform:scale(1,1) translateX(-1px)}to{transform:scale(.85,1.18) translateX(1px)}}
.tglow{position:absolute;left:50%;top:14px;width:240px;height:240px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,150,60,.45),rgba(255,110,30,.12) 40%,transparent 68%);mix-blend-mode:screen;pointer-events:none;animation:tg 1.9s ease-in-out infinite alternate}
.tpool{position:absolute;left:50%;bottom:-10px;width:200px;height:26px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(255,140,50,.35),transparent 70%);mix-blend-mode:screen;animation:tg 1.6s ease-in-out infinite alternate}
@keyframes tg{0%{opacity:.75}35%{opacity:.95}60%{opacity:.7}100%{opacity:1}}
.spark{position:absolute;left:50%;top:0;width:2px;height:2px;border-radius:50%;background:#ffd27a;animation:spk 1.6s linear infinite;opacity:0}
@keyframes spk{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),-70px)}}
.fore{position:absolute;left:0;bottom:0;pointer-events:none;filter:blur(3px);will-change:transform;z-index:6}
/* dark mood */
.sil .grin{opacity:0;transition:opacity 1.5s}.player.dk1 .grin,.player.dk2 .grin{opacity:.92}
.closeup{position:absolute;inset:0;z-index:30;overflow:hidden;pointer-events:none;--rim:#ff3b2a;--rim2:#ff9a7a;--rimglow:rgba(255,30,20,.8);
  background:radial-gradient(circle at 50% 40%,rgba(150,0,0,.55),rgba(20,0,0,.95) 55%,#000 80%);animation:cuIn .45s ease-out both;transition:opacity .6s}
.closeup.out{opacity:0}
.closeup .grin{opacity:1}
.cuin{position:absolute;left:50%;top:40%;transform-origin:50% 262px;animation:cuZoom 2.8s ease-out both}
.cuin svg{display:block;transform:translate(-50%,-262px)}
.cuin .eye{r:1.5;fill:#fff2e0}.cuin .eglow{r:2.6;opacity:.85}
.cucap{position:absolute;left:0;right:0;bottom:17%;text-align:center;color:#ffb3a3;font-size:22px;letter-spacing:.06em;text-shadow:0 0 12px #ff2a1a;opacity:0;animation:cuCap 2.6s .5s ease-out both}
@keyframes cuIn{from{opacity:0}to{opacity:1}}
@keyframes cuZoom{from{transform:scale(.9)}to{transform:scale(1.12)}}
@keyframes cuCap{0%{opacity:0}25%{opacity:1}80%{opacity:1}100%{opacity:.6}}
.scene .rs{opacity:0;transition:opacity 3.5s ease}.scene.red .rs{opacity:1}
.redveil{position:absolute;inset:0;pointer-events:none;z-index:10;opacity:0;transition:opacity 2.5s;background:radial-gradient(ellipse at 50% 55%,transparent 30%,rgba(110,0,0,.5) 75%,rgba(40,0,0,.9) 100%)}
.scene.dk1 .redveil{opacity:.55;animation:beat 1.3s infinite}
.scene.dk2 .redveil{opacity:.9;animation:beat .95s infinite}
@keyframes beat{0%,100%{transform:scale(1)}10%{transform:scale(1.04)}22%{transform:scale(1)}32%{transform:scale(1.025)}}
.scene.dk1 .sky,.scene.dk1 .lay{filter:saturate(.65) brightness(.75)}
.scene.dk2 .sky{filter:saturate(.45) brightness(.45) contrast(1.2)}
.scene.dk2 .lay{filter:saturate(.4) brightness(.5)}
.scene.dk2 .rays{opacity:.08}
.scene.dk2 .fog{filter:blur(18px) sepia(1) hue-rotate(-40deg) saturate(3) brightness(.6)}
.aura{position:absolute;left:50%;bottom:-10px;width:150px;height:200px;transform:translateX(-50%);pointer-events:none;opacity:0;transition:opacity 2s;
  background:radial-gradient(ellipse at 50% 70%,rgba(160,0,0,.55),rgba(60,0,0,.35) 45%,transparent 70%);filter:blur(6px);animation:auraP 2.6s ease-in-out infinite}
.player.dk1 .aura{opacity:.7}.player.dk2 .aura{opacity:1;width:200px;height:250px}
@keyframes auraP{50%{transform:translateX(-50%) scale(1.08,1.12)}}
.player.dk1,.player.dk2{--rim:#ff3b2a;--rim2:#ff8a6a;--rimglow:rgba(255,0,0,.65)}
.player.dk2 svg{transform:scale(1.12);transform-origin:50% 100%}
.player.dk2.left svg{transform:scale(-1.12,1.12)}
.npc.slain{animation:slain 1.6s forwards}
@keyframes slain{0%{filter:brightness(3);transform:translateX(-50%)}30%{filter:brightness(1)}100%{opacity:0;transform:translateX(-50%) translateY(10px) scaleY(.2);filter:blur(4px) brightness(.3)}}
.killcard{border-color:rgba(255,70,50,.6)!important;box-shadow:0 0 60px rgba(160,0,0,.45),0 20px 60px #000!important}
.kbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kbtn{border-radius:10px;padding:14px 8px;font-family:"Noto Serif Thai";font-size:16px;border:1px solid}
.kbtn.kill{background:linear-gradient(#5a0d0d,#2a0505);border-color:#ff5a3a;color:#ffd2c4}
.kbtn.spare{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.35);color:#eee}
.kbtn.spare[disabled]{opacity:.35;text-decoration:line-through}
.knarr{font-family:"Noto Serif Thai";font-size:15px;line-height:1.75;color:#f0d9d0;border-left:2px solid #ff5a3a;padding:6px 12px;margin-top:10px;animation:subin .8s;background:linear-gradient(90deg,rgba(255,60,40,.08),transparent)}
/* full screens */
.full{position:absolute;inset:0;z-index:35;overflow-y:auto;padding:16px;background:#000}
.keyart{position:relative;height:68vh;min-height:420px;margin:-16px -16px 0;overflow:hidden}

function silentWav(){const n=800,b=new ArrayBuffer(44+n*2),v=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"}));}

    const comp=AC.createDynamicsCompressor();comp.threshold.value=-30;comp.knee.value=12;comp.ratio.value=10;comp.attack.value=.003;comp.release.value=.2;
    const out=AC.createGain();out.gain.value=2.2;master.connect(comp);comp.connect(out);out.connect(AC.destination);}
  if(AC.state!=="running")AC.resume();return AC;}
function tone(f,d,type,vol){if(VOL<=0)return;try{const A=ac(),t=A.currentTime,base=(vol||.06)*2.4;

  parts.forEach(([fr,ty,k])=>{const o=A.createOscillator(),g=A.createGain();o.type=ty;o.frequency.value=fr;g.gain.setValueAtTime(base*k,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d);});
}catch(e){}}

function rng(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function layerSVG(L,w,seed){

      for(let t=0;t<3;t++){const cx=x+bw*(.2+t*.3),top=by-30-r()*60-(t===1?50:0);p+=`<path d="M${cx-16} ${by} Q${cx-14} ${top+40} ${cx} ${top} Q${cx+14} ${top+40} ${cx+16} ${by} Z" fill="${L.c}"/>`;}}}

const thaiNum=n=>String(n).replace(/\d/g,d=>"๐๑๒๓๔๕๖๗๘๙"[d]);

/* ---------------- เอฟเฟกต์: ฟิล์มเกรน + อนุภาค ---------------- */
let grainCv=null, grainCtx=null, fxCv=null, fxCtx=null, parts=[], fxKind="dust", grainT=0, boltT=4;
let grainURL=null;
function makeGrain(host){ if(!grainURL){const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d"),d=x.createImageData(180,180);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}x.putImageData(d,0,0);grainURL=c.toDataURL();}
  grainCv=document.createElement("div");grainCv.className="grain";grainCv.style.backgroundImage=`url(${grainURL})`;host.appendChild(grainCv);grainCtx=true;}
function drawGrain(){if(!grainCtx||!grainCv)return;grainCv.style.backgroundPosition=`${Math.random()*180|0}px ${Math.random()*180|0}px`;}
function makeFx(host,kind){fxKind=kind;fxCv=document.createElement("canvas");fxCv.className="fx";host.appendChild(fxCv);fxCtx=fxCv.getContext("2d");sizeFx();parts=[];for(let i=0;i<(kind==="star"?70:kind==="ash"?90:45);i++)parts.push(newPart(true));}
function sizeFx(){if(!fxCv)return;const r=Math.min(2,window.devicePixelRatio||1);fxCv.width=fxCv.clientWidth*r;fxCv.height=fxCv.clientHeight*r;fxCtx.setTransform(r,0,0,r,0,0);}
function newPart(init){const W=fxCv.clientWidth,H=fxCv.clientHeight;const p={x:Math.random()*W,y:init?Math.random()*H:(fxKind==="ember"?H+10:fxKind==="petal"?-10:Math.random()*H),r:Math.random(),t:Math.random()*6.28};
  if(fxKind==="ember"){p.vx=(Math.random()-.5)*20;p.vy=-(20+Math.random()*40);}
  else if(fxKind==="petal"){p.vx=10+Math.random()*20;p.vy=15+Math.random()*25;}
  else if(fxKind==="star"){p.y=Math.random()*H*.6;p.vx=0;p.vy=0;}
  else if(fxKind==="ash"){p.y=init?Math.random()*H:-10;p.vx=-6+Math.random()*10;p.vy=14+Math.random()*22;}
  else {p.vx=(Math.random()-.5)*8;p.vy=-(2+Math.random()*6);}
  return p;}
function drawFx(dt){
  if(!fxCtx)return;const W=fxCv.clientWidth,H=fxCv.clientHeight;fxCtx.clearRect(0,0,W,H);
  parts.forEach((p,i)=>{p.t+=dt;p.x+=p.vx*dt+(fxKind==="petal"?Math.sin(p.t*2)*.6:0);p.y+=p.vy*dt;
    if(p.y<-20||p.y>H+20||p.x>W+20||p.x<-20){parts[i]=newPart(false);return;}
    if(fxKind==="ember"){const a=.5+.5*Math.sin(p.t*6);fxCtx.fillStyle=`rgba(255,${120+p.r*80|0},40,${.4+.5*a})`;fxCtx.beginPath();fxCtx.arc(p.x,p.y,.8+p.r*1.8,0,7);fxCtx.fill();}
    else if(fxKind==="petal"){fxCtx.save();fxCtx.translate(p.x,p.y);fxCtx.rotate(p.t*1.5);fxCtx.fillStyle=`rgba(255,${170+p.r*50|0},200,.75)`;fxCtx.beginPath();fxCtx.ellipse(0,0,3+p.r*2,1.6+p.r,0,0,7);fxCtx.fill();fxCtx.restore();}
    else if(fxKind==="star"){const a=.3+.7*Math.abs(Math.sin(p.t*(.5+p.r)));fxCtx.fillStyle=`rgba(220,230,255,${a*.8})`;fxCtx.fillRect(p.x,p.y,1+p.r,1+p.r);}
    else if(fxKind==="ash"){fxCtx.fillStyle=p.r<.25?`rgba(255,${80+p.r*200|0},40,.8)`:`rgba(${120+p.r*60|0},${110+p.r*50|0},${105+p.r*50|0},.55)`;fxCtx.fillRect(p.x,p.y,1+p.r*2.5,1+p.r*1.5);}
    else if(fxKind==="gold"){const a=.4+.6*Math.abs(Math.sin(p.t*2));fxCtx.fillStyle=`rgba(255,215,140,${a*.7})`;fxCtx.beginPath();fxCtx.arc(p.x,p.y,.6+p.r*1.4,0,7);fxCtx.fill();}
    else {fxCtx.fillStyle=`rgba(255,230,190,${.15+p.r*.35})`;fxCtx.beginPath();fxCtx.arc(p.x,p.y,.5+p.r*1.5,0,7);fxCtx.fill();}
  });
}
window.addEventListener("resize",sizeFx);

function dancerRig(svg){

  const vec=p=>[p[1][0],p[1][1],-p[2][0],-p[2][1],p[3][0],p[3][1],-p[4][0],-p[4][1],p[5],p[6],p[8]||0];

    const g=svg.querySelector(pr.k==="gem"?"#dgem":"#ddisc"); const hand=svg.querySelector(pr.h==="L"?"#dlaf rect":"#draf rect");
    const b=hand.getBBox(); let p=svg.createSVGPoint(); p.x=b.x+b.width/2; p.y=b.y+b.height+16;

    g.setAttribute("transform",`translate(${p.x} ${p.y})`); g.style.opacity=1;}

    const tgt=vec(pose), from=cur.slice(), t0=performance.now(); ms=ms||750; if(anim)cancelAnimationFrame(anim);
    propAt(null);
    const step=t=>{let k=Math.min(1,(t-t0)/ms);k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;cur=from.map((a,i)=>a+(tgt[i]-a)*k);apply(cur);
      if(k<1)anim=requestAnimationFrame(step);else{anim=null;propAt(pose[7]);}};
    anim=requestAnimationFrame(step);
  }
  apply(cur);
  return {to,stop(){if(anim)cancelAnimationFrame(anim);}};
}

  t.ra=[ -10*D, 0,  p[2][0]*D ]; t.rf=[ (p[2][1]<-60?-25:-8)*D, 0,  p[2][1]*D ];
  if(kneel){t.ll=[-82*D,0,-Math.min(p[3][0],30)*.4*D];t.lk=[155*D,0,0];t.rl=[-82*D,0,Math.min(p[4][0],30)*.4*D];t.rk=[155*D,0,0];

    if(p[0]==="สอดสร้อยมาลา"){t.rl=[-70*D,0,10*D];t.rk=[80*D,0,0];}}
  else{t.ll=[-p[3][0]*.2*D,0,-p[3][0]*D*.3];t.lk=[-p[3][1]*D*.6,0,0];t.rl=[-p[4][0]*.2*D,0,p[4][0]*D*.3];t.rk=[-p[4][1]*D*.6,0,0];}
  t.tor=[ (p[0]==="มัจฉาชมสาคร"?12:0)*D,0,-p[5]*D]; t.head=[0,-p[6]*.6*D,-p[6]*D];
  t.drop=kneel?-(p[8]/300*1.75):-(p[8]||0)/300*1.6;
  t.prop=(p[7]&&typeof p[7]==="object")?p[7].k:p[7]; t.kneel=kneel; t.hand="wong";
  if(p[0]==="นาคาม้วนหาง"){ // seated on the floor, viewer-left leg stretched forward, viewer-left hand points down at it
    t.ll=[-88*D,0,-8*D]; t.lk=[0,0,0]; t.rl=[-82*D,0,10*D]; t.rk=[150*D,0,0];
    t.la=[-62*D,0,-16*D]; t.lf=[-28*D,0,6*D]; t.ra=[-25*D,0,100*D]; t.rf=[-10*D,0,45*D];
    t.tor=[12*D,-.15,0]; t.head=[38*D,-.5,0]; t.drop=-.5; t.kneel=true; t.naka=true; t.hand="point";}
  return t;}
const J={la:LA.sh,lf:LA.el,ra:RA.sh,rf:RA.el,ll:LL.hip,lk:LL.knee,rl:RL.hip,rk:RL.knee,tor:torso,head:headG};
let cur=target(STAND),from=cur,to=cur,tw=1;
function lerp(a,b,k){return a+(b-a)*k;}
function applyPose(k){
  const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  for(const n in J){J[n].rotation.set(lerp(from[n][0],to[n][0],e),lerp(from[n][1],to[n][1],e),lerp(from[n][2],to[n][2],e));}
  pelvis.position.y=.98+lerp(from.drop,to.drop,e);
  const kf=lerp(from.kneel?1:0,to.kneel?1:0,e);
  skirtG.scale.set(1+.55*kf,1-.4*kf,1+.55*kf);
  const showL=!to.kneel||to.naka||e<.5, showR=!to.kneel||e<.5;
  LL.hip.visible=showL; RL.hip.visible=showR;
}
function setInstant(t){for(const n in J)J[n].rotation.set(t[n][0],t[n][1],t[n][2]);pelvis.position.y=.98+t.drop;skirtG.scale.set(t.kneel?1.55:1,t.kneel?.6:1,t.kneel?1.55:1);root.updateMatrixWorld(true);}
const _v=new T.Vector3();
function armHits(A){ // sample points along forearm + hand; test against torso, head, skirt
  const pts=[];const el=new T.Vector3(),wr=new T.Vector3(),tip=new T.Vector3();
  A.el.getWorldPosition(el);A.wr.getWorldPosition(wr);A.tipP.getWorldPosition(tip);
  for(const k of [.35,.7,1])pts.push(el.clone().lerp(wr,k));pts.push(wr.clone().lerp(tip,.5),tip);
  let hit=0;
  for(const q of pts){
    const lt=torso.worldToLocal(_v.copy(q));const r=torsoR(lt.y);
    if(r>0){const d=Math.pow(lt.x/(r+.05),2)+Math.pow(lt.z/((r+.05)*.72+.03),2);if(d<1)hit=Math.max(hit,1);}
    const lh=headG.worldToLocal(_v.copy(q));if(lh.distanceTo(new T.Vector3(0,.1,0))<.135)hit=Math.max(hit,1);
    const lp=pelvis.worldToLocal(_v.copy(q));if(lp.y<.03&&lp.y>-.8){const rr=skirtR(lp.y)*(1+.55*(solveK?1:0))+.035;if(Math.hypot(lp.x,lp.z)<rr)hit=Math.max(hit,2);}
  }
  return hit;}
function legOut(L){ // knee/ankle/toe outside the skirt (above the hem)?
  const q=[];const k=new T.Vector3();L.knee.getWorldPosition(k);q.push(k);const a=new T.Vector3(0,-.36,0);L.knee.localToWorld(a);q.push(a);
  return q.some(p=>{const lp=pelvis.worldToLocal(p.clone());return lp.y>-.78&&Math.hypot(lp.x,lp.z)>skirtR(lp.y)-.03;});}
let solveK=false;
/* CCD IK: aim the pointing fingertip at the stretched leg */
function ikPoint(t){
  setInstant(t);
  const tgt=new T.Vector3(0,-.32,.03);LL.hip.localToWorld(tgt); // a spot on the thigh near the knee
  const joints=[[LA.wr,null],[LA.el,"lf"],[LA.sh,"la"]];
  const jp=new T.Vector3(),tp=new T.Vector3(),q=new T.Quaternion(),pq=new T.Quaternion(),wq=new T.Quaternion();
  for(let it=0;it<30;it++){
    for(const [j,key] of joints){
      if(!key)continue;
      j.getWorldPosition(jp);LA.tipP.getWorldPosition(tp);
      const a=tp.clone().sub(jp).normalize(),b=tgt.clone().sub(jp).normalize();
      q.setFromUnitVectors(a,b);
      j.getWorldQuaternion(wq);j.parent.getWorldQuaternion(pq);
      const nw=q.multiply(wq);j.quaternion.copy(pq.invert().multiply(nw));j.updateMatrixWorld(true);
      const e=new T.Euler().setFromQuaternion(j.quaternion);t[key]=[e.x,e.y,e.z];
    }
    LA.tipP.getWorldPosition(tp);if(tp.distanceTo(tgt)<.06)break;
  }
  // keep the fingertip just above the thigh, not inside it
  t.lf=[t.lf[0],t.lf[1],t.lf[2]];
}
function solve(t){solveK=!!t.kneel;
  const save={};for(const n in J){const r=J[n].rotation;save[n]=[r.x,r.y,r.z];}const sy=pelvis.position.y,ss=skirtG.scale.clone();
  [[LA,"la","lf",-1],[RA,"ra","rf",1]].forEach(([A,u,f,sg])=>{
    if(t.naka&&A===LA){ikPoint(t);return;}
    for(let it=0;it<40;it++){setInstant(t);const h=armHits(A);if(!h)break;
      if(h===2){t[u][2]+=sg*4*D;}            // hand inside skirt: open arm outward
      else{t[u][0]-=5*D;t[f][0]-=3*D;}        // hand inside torso/head: bring arm forward
    }});
  if(!t.kneel){[[LL,"ll","lk"],[RL,"rl","rk"]].forEach(([L,a,b])=>{for(let it=0;it<20;it++){setInstant(t);if(!legOut(L))break;t[a][0]*=.85;t[a][2]*=.85;t[b][0]*=.85;}});}
  for(const n in J)J[n].rotation.set(save[n][0],save[n][1],save[n][2]);pelvis.position.y=sy;skirtG.scale.copy(ss);root.updateMatrixWorld(true);
}


let az=.35,el=.12,dist=4.6,last=performance.now(),dur=.9,alive=true;
function poseTo(p,ms){from={};for(const n in J){const r=J[n].rotation;from[n]=[r.x,r.y,r.z];}from.drop=pelvis.position.y-.98;from.kneel=to&&to.kneel;
  to=target(p);solve(to);tw=0;dur=Math.max(.3,(ms||900)/1000);handMode(LA,to.hand==="point"?"point":"wong");handMode(RA,"wong");}
function resize(){const w=cv.clientWidth||300,h=cv.clientHeight||400;R.setPixelRatio(Math.min(2,devicePixelRatio||1));R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();dist=w<h?4.9:4.2;}
resize();
function loop(t){
  if(!alive)return;
  const dt=Math.min(.05,(t-last)/1000);last=t;
  let ta=to.naka?-0.95:.25+Math.sin(t/5200)*.75, te=to.naka?.28:.12;
  let dA=(ta-az)%(2*Math.PI);if(dA>Math.PI)dA-=2*Math.PI;if(dA<-Math.PI)dA+=2*Math.PI;az+=dA*Math.min(1,dt*(to.naka?2:.8));el+=(te-el)*Math.min(1,dt*2);
  if(tw<1){tw=Math.min(1,tw+dt/dur);applyPose(tw);}
  root.position.y=Math.sin(t/900)*.006; root.rotation.y=Math.sin(t/1700)*.05;
  const pr=to.prop; gemP.visible=pr==="gem"&&tw>.7; discP.visible=pr==="disc"&&tw>.7;
  if(gemP.visible){LA.wr.getWorldPosition(gemP.position);gemP.position.y-=.1;gemP.rotation.y+=dt*2;gemLight.intensity=1.2;}
  if(discP.visible){LA.wr.getWorldPosition(discP.position);discP.position.y+=.02;discP.rotation.z+=dt*4;discP.lookAt(cam.position);}
  dust.rotation.y+=dt*.02;
  const nk=to.naka&&tw>.85, pulse=.55+.45*Math.sin(t/180);
  if(nk){const a=new T.Vector3(),b=new T.Vector3(0,-.32,.03);LA.tipP.getWorldPosition(a);LL.hip.localToWorld(b);
    rayG.setFromPoints([a,b]);ray.material.opacity=.9*pulse;ring.position.copy(b);ring.lookAt(cam.position);ring.scale.setScalar(1+.3*pulse);ring.material.opacity=.9;tipGlow.position.copy(a);tipGlow.material.opacity=pulse;}
  else{ray.material.opacity=0;ring.material.opacity=0;tipGlow.material.opacity=0;}
  const ty=new T.Vector3(0,1.05+(pelvis.position.y-.98)*.6,0);
  cam.position.set(Math.sin(az)*Math.cos(el)*dist,ty.y+Math.sin(el)*dist,Math.cos(az)*Math.cos(el)*dist);cam.lookAt(ty);
  R.render(S,cam);requestAnimationFrame(loop);
}
tw=1;applyPose(1);requestAnimationFrame(loop);
return {to:poseTo,resize,stop(){alive=false;try{R.dispose();R.forceContextLoss();}catch(e){}}};
}
function makeDancer(wrap,h){
  wrap.innerHTML=`<div class="dload">กำลังเตรียมเวที…</div>`;
  return loadThree().then(ok=>{
    if(ok){try{const w=Math.round(Math.min(innerWidth*.96,h*.95));wrap.classList.add("d3");
      wrap.innerHTML=`<canvas class="d3c" style="width:${w}px;height:${h}px"></canvas>`;return makeApsara3D(wrap.firstChild);}catch(e){console.warn(e);}}
    wrap.classList.remove("d3");wrap.innerHTML=dancerSVG(h);return dancerRig(wrap.querySelector("svg.dancer"));});}
function pzDance(P,pz,next){
  pz.classList.add("stage");
  pz.innerHTML=`<div class="dstage">
     <div class="dspot"></div>
     <div class="dwrap" id="dw"></div>
     <div class="dcap"><div class="dnum" id="dn"></div><div class="dname" id="dnm">เทพอัปสรเตรียมร่ายรำ…</div></div>
     <div class="ddots">${DPOSES.map(()=>`<i></i>`).join("")}</div>
     <div class="dbtns" id="db"><button class="btn gold" id="dskip">ข้ามการแสดง ›</button></div>
   </div>`;
  let rig={to(){},stop(){}}, i=-1, tm=null, alive=true;
  const ready=makeDancer(pz.querySelector("#dw"),Math.round(Math.min(440,window.innerHeight*.52))).then(r=>{if(!alive){r.stop();return;}rig=r;});
  const notes=[523,587,659,784,880,1047,880,784,659,587,523,659];
  function show(){
    if(!alive)return; i++;
    const dots=pz.querySelectorAll(".ddots i");
    if(i>=DPOSES.length){
      rig.to([0,[10,-10],[10,-10],[0,0],[0,0],0,0],900);
      pz.querySelector("#dn").textContent="จบการแสดง"; pz.querySelector("#dnm").textContent="ครบ ๑๘ ท่า";
      pz.querySelector("#db").innerHTML=`<button class="btn gold" id="again">ดูอีกครั้ง</button><button class="btn" id="go">ไปเรียงบทประพันธ์ท่ารำ ›</button>`;
      pz.querySelector("#again").onclick=()=>{i=-1;dots.forEach(d=>d.classList.remove("on"));pz.querySelector("#db").innerHTML=`<button class="btn gold" id="dskip">ข้ามการแสดง ›</button>`;pz.querySelector("#dskip").onclick=finish;show();};
      pz.querySelector("#go").onclick=finish; return;
    }
    const p=DPOSES[i]; rig.to(p,800); tone(notes[i%notes.length],1.1,"triangle",.07); setTimeout(()=>tone(notes[i%notes.length]*1.5,.8,"sine",.03),180);
    dots.forEach((d,k)=>d.classList.toggle("on",k<=i));
    pz.querySelector("#dn").textContent=`ท่าที่ ${thaiNum(i+1)} / ${thaiNum(19)}`;
    const nm=pz.querySelector("#dnm"); nm.textContent=p[0]; nm.classList.remove("in"); void nm.offsetWidth; nm.classList.add("in");
    tm=setTimeout(show,2300);
  }
  function finish(){alive=false;clearTimeout(tm);rig.stop();pz.classList.remove("stage");next();}
  pz.querySelector("#dskip").onclick=finish;
  ready.then(()=>setTimeout(show,500));
}

function pzTrap(P,pz,next){
  pz.classList.add("stage");
  pz.innerHTML=`<div class="dstage"><div class="dspot"></div>
     <div class="dwrap" id="dw"></div>

     <div class="q" style="text-align:center;font-size:15px;margin:6px 0 0">“ท่าสุดท้ายนะจ๊ะ… ชี้นิ้วลงที่ขาตัวเอง แบบนี้”</div>
     <div style="text-align:center;font-size:13px;color:var(--muted)">เจ้ารู้ความลับแล้ว… แต่นนทกหลงเสน่ห์จนห้ามใจไม่อยู่</div>
     <div class="dbtns"><button class="btn" id="go" style="opacity:0;transition:opacity .6s">รำตามท่านาคาม้วนหาง</button></div></div>`;

}

  return G.journal.map((j,i)=>`<div class="jn"><div class="t">${thaiNum(i+1)} · ${esc(j.t)}</div>${verseHTML(j.v)}<div class="th">${esc(j.th)}</div></div>`).join("");
}
function journal(){

  const ov=document.createElement("div");ov.className="full";

     <div style="position:absolute;left:50%;bottom:26%;transform:translateX(-50%);display:flex;gap:30px;align-items:flex-end;--rim:#9fc0ff;--rim2:#e0ebff;--rimglow:rgba(120,160,255,.6)">${sprite("narai",200)}${sprite("nontok",180)}</div>

   <div class="menu">

     <div class="card" style="margin-top:12px"><div class="pzhead">ชื่อ-นามสกุล / เลขที่ / ห้อง</div>
       <input type="text" id="nm" placeholder="เช่น ด.ช.มานะ ใจกล้า เลขที่ 5 ม.2/1" value="${esc(G.name||"")}">

  makeGrain(document.getElementById("ka")); const gi=setInterval(()=>{if(!document.getElementById("ka"))return clearInterval(gi);drawGrain();},90);

     <div style="font-size:26px;color:var(--gold);letter-spacing:6px">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div>
     <div style="font-size:13px;color:#cbbfa8">ไขกลอนได้ ${thaiNum(G.journal.length)} บท · ตอบผิด ${thaiNum(G.mist)} ครั้ง</div>
     <div style="font-size:11px;color:var(--muted)">${new Date().toLocaleString("th-TH")}</div>`;};
